<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk ke Akun | Pilah</title>
  <meta name="description" content="Masuk ke aplikasi Pilah untuk melihat dan mencatat setoran sampah rumah tangga.">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/komponen.css">
</head>
<body>
  <header class="nav-utama">
    <div class="wadah nav-konten">
      <a href="/" class="nav-merek" aria-label="Beranda Pilah">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
          <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
        </svg>
        <span>Pilah</span>
      </a>

      <nav aria-label="Navigasi situs">
        <ul class="nav-tautan">
          <li><a href="/panduan.html">Panduan Memilah</a></li>
          <li><a href="/daftar.html">Belum punya akun? Daftar</a></li>
        </ul>
      </nav>

      <div class="nav-aksi">
        <button id="btn-ganti-tema" class="btn-ikon" type="button" aria-label="Ganti mode tema"></button>
      </div>
    </div>
  </header>

  <main class="wadah">
    <div class="autentikasi-wrapper">
      <!-- FORM MASUK (Kiri) -->
      <div class="autentikasi-form-box">
        <div class="jarak-bawah-4">
          <h1 class="judul-masuk">Masuk ke Pilah</h1>
          <p class="teks-tinta-pudar teks-sub">
            Buka buku catatan sampah Anda dan lanjutkan kebiasaan baik minggu ini.
          </p>
        </div>

        <!-- Kotak Bantuan Akun Percontohan -->
        <div class="kotak-peringatan">
          <div class="flex-antara">
            <div>
              <span class="teks-lumut teks-demo-label">Akun Percontohan (Demo)</span>
              <span class="angka-mono teks-demo-val">burani@contoh.id / Pilah2026!</span>
            </div>
            <button type="button" id="btn-isi-demo" class="btn btn-sm btn-garis btn-demo-isi">
              Isi Cepat
            </button>
          </div>
        </div>

        <form id="form-masuk" novalidate>
          <div class="grup-form">
            <label for="input-email">Alamat Email</label>
            <input type="email" id="input-email" class="kontrol-input" placeholder="nama@contoh.id" autocomplete="email" required>
            <div id="galat-email" class="pesan-galat" aria-live="polite"></div>
          </div>

          <div class="grup-form">
            <label for="input-sandi">Kata Sandi</label>
            <div class="pembungkus-sandi">
              <input type="password" id="input-sandi" class="kontrol-input" placeholder="Masukkan kata sandi Anda" autocomplete="current-password" required>
              <button type="button" id="btn-toggle-sandi" class="btn-intip-sandi" aria-label="Lihat kata sandi" title="Lihat kata sandi">
                <svg id="ikon-mata" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
            <div id="galat-sandi" class="pesan-galat" aria-live="polite"></div>
          </div>

          <div id="galat-umum" class="pesan-galat galat-box" aria-live="polite"></div>

          <button type="submit" id="btn-submit-masuk" class="btn btn-primer lebar-penuh jarak-atas-2">
            Masuk ke Dasbor
          </button>
        </form>

        <p class="teks-tinta-pudar teks-ajakan-bawah">
          Belum punya akun? <a href="/daftar.html" class="teks-tebal">Daftar di sini</a>
        </p>
      </div>

      <!-- ILUSTRASI KANAN -->
      <div class="autentikasi-ilustrasi" aria-hidden="true">
        <svg class="ilustrasi-svg" viewBox="0 0 340 380" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="170" cy="190" r="150" fill="var(--kertas-tebal)" stroke="var(--serat)" stroke-width="2"/>
          <g transform="translate(60, 160)">
            <rect x="0" y="20" width="60" height="120" rx="6" fill="var(--warna-organik)" stroke="var(--serat)" stroke-width="2"/>
            <rect x="-4" y="10" width="68" height="14" rx="4" fill="var(--warna-organik)" stroke="var(--serat)" stroke-width="2"/>
            <text x="30" y="85" text-anchor="middle" font-size="9" font-weight="700" fill="var(--kertas)">ORGANIK</text>
          </g>
          <g transform="translate(135, 130)">
            <rect x="0" y="20" width="70" height="150" rx="6" fill="var(--warna-plastik)" stroke="var(--serat)" stroke-width="2"/>
            <rect x="-5" y="10" width="80" height="14" rx="4" fill="var(--warna-plastik)" stroke="var(--serat)" stroke-width="2"/>
            <text x="35" y="100" text-anchor="middle" font-size="9" font-weight="700" fill="var(--kertas)">PLASTIK</text>
          </g>
          <g transform="translate(220, 170)">
            <rect x="0" y="20" width="60" height="110" rx="6" fill="var(--warna-kertas)" stroke="var(--serat)" stroke-width="2"/>
            <rect x="-4" y="10" width="68" height="14" rx="4" fill="var(--warna-kertas)" stroke="var(--serat)" stroke-width="2"/>
            <text x="30" y="80" text-anchor="middle" font-size="9" font-weight="700" fill="var(--kertas)">KERTAS</text>
          </g>
        </svg>
        <p class="teks-lumut teks-ilustrasi-bawah">
          Konsisten mencatat, pantau progres mingguan.
        </p>
      </div>
    </div>
  </main>

  <script src="/js/tema.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/masuk.js"></script>
</body>
</html>
